name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve source bytes for snapshot verification
        run: git config --global core.autocrlf false
      - name: Check out CodeNarrator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out fixed VisProg input
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: allenai/visprog
          ref: 9626868c0d1007c41d8f210fe99f5c1facc3325f
          path: research/visprog
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run full offline suite without skips
        run: >-
          python -c "import sys, unittest;
          suite = unittest.defaultTestLoader.discover('tests');
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)"
      - name: Verify fixed source and translation records
        run: python examples/build_visprog.py
      - name: Build standalone skill
        run: python scripts/package_skill.py
